<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Engine Test v2 (internal)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background:#111; color:#eee; }
  button { display:block; margin:8px 0; padding:12px 16px; font-size:16px; border-radius:8px; border:0; background:#2d9cdb; color:#fff; cursor:pointer; }
  #log { background:#000; color:#8f8; padding:10px; white-space:pre-wrap; font-size:12px; max-height:300px; overflow:auto; border-radius:8px; }
  #summary { background:#222; padding:10px; border-radius:8px; margin:10px 0; font-size:14px; }
  figure { display:inline-block; margin:10px; vertical-align:top; }
  figure canvas { max-width:400px; height:auto; display:block; border:1px solid #444; }
  figcaption { font-size:13px; margin-top:4px; max-width:400px; }
  a { color:#7cf; }
</style>
</head>
<body>
<h1>Background engine test v2 (internal)</h1>
<p>BiRefNet driven DIRECTLY through ONNX Runtime Web (no wrapper library). Pick a photo, run A and/or B. Results appear below on blue.</p>
<input type="file" id="file" accept="image/*">
<div id="info">No photo yet.</div>
<button id="btnA">Run A2: BiRefNet-lite 1024 direct (onnx-community)</button>
<button id="btnB">Run B2: BiRefNet-lite 512 direct (studioludens)</button>
<button id="btnD">Run A3: BiRefNet-lite 1024 WebGPU-patched (jiabins)</button>
<div id="summary">SUMMARY: nothing run yet.</div>
<div id="results"></div>
<pre id="log"></pre>

<script type="module">
const logEl = document.getElementById('log');
const summaryEl = document.getElementById('summary');
const resultsEl = document.getElementById('results');
const summaries = {};
function log(msg) {
  const line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.textContent += line + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  console.log(line);
}
function setSummary(key, text) {
  summaries[key] = text;
  summaryEl.textContent = 'SUMMARY: ' + Object.entries(summaries).map(([k, v]) => k + ' = ' + v).join(' | ');
}
let photoFile = null, photoURL = null, photoImg = null;
document.getElementById('file').addEventListener('change', async (e) => {
  photoFile = e.target.files[0];
  if (!photoFile) return;
  photoURL = URL.createObjectURL(photoFile);
  photoImg = new Image();
  await new Promise((res, rej) => { photoImg.onload = res; photoImg.onerror = rej; photoImg.src = photoURL; });
  document.getElementById('info').textContent = 'Photo: ' + photoFile.name + ' — ' + photoImg.naturalWidth + 'x' + photoImg.naturalHeight + ', ' + Math.round(photoFile.size / 1024) + ' KB. WebGPU available: ' + (!!navigator.gpu);
  log('Photo loaded: ' + photoImg.naturalWidth + 'x' + photoImg.naturalHeight + '. navigator.gpu = ' + (!!navigator.gpu));
});

function showResult(label, cutoutCanvas) {
  const blue = document.createElement('canvas');
  blue.width = cutoutCanvas.width; blue.height = cutoutCanvas.height;
  const bctx = blue.getContext('2d');
  bctx.fillStyle = '#2f7fe0'; bctx.fillRect(0, 0, blue.width, blue.height);
  bctx.drawImage(cutoutCanvas, 0, 0);
  const fig = document.createElement('figure');
  const view = document.createElement('canvas');
  view.width = blue.width; view.height = blue.height;
  view.getContext('2d').drawImage(blue, 0, 0);
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  const dlPng = document.createElement('a');
  dlPng.textContent = 'Download cutout PNG';
  dlPng.download = label.replace(/[^a-z0-9]+/gi, '_') + '_cutout.png';
  dlPng.href = cutoutCanvas.toDataURL('image/png');
  const dlJpg = document.createElement('a');
  dlJpg.textContent = ' Download blue JPG';
  dlJpg.download = label.replace(/[^a-z0-9]+/gi, '_') + '_blue.jpg';
  dlJpg.href = blue.toDataURL('image/jpeg', 0.92);
  cap.appendChild(document.createElement('br'));
  cap.appendChild(dlPng); cap.appendChild(dlJpg);
  fig.appendChild(view); fig.appendChild(cap);
  resultsEl.appendChild(fig);
}

function cutoutFromAlpha(alphaCanvas) {
  const w = photoImg.naturalWidth, h = photoImg.naturalHeight;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  ctx.drawImage(photoImg, 0, 0);
  const mask = document.createElement('canvas'); mask.width = w; mask.height = h;
  mask.getContext('2d').drawImage(alphaCanvas, 0, 0, w, h);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.drawImage(mask, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  return out;
}

// --- float16 helpers (for fp16 model files) ---
const _f32 = new Float32Array(1); const _i32 = new Int32Array(_f32.buffer);
function f32ToF16(val) {
  _f32[0] = val; const x = _i32[0];
  const sign = (x >> 16) & 0x8000;
  let exp = ((x >> 23) & 0xff) - 112;
  let mant = x & 0x7fffff;
  if (exp <= 0) {
    if (exp < -10) return sign;
    mant |= 0x800000;
    const shift = 14 - exp;
    let half = mant >> shift;
    if ((mant >> (shift - 1)) & 1) half++;
    return sign | half;
  }
  if (exp >= 31) return sign | 0x7c00;
  return sign | (exp << 10) | (mant >> 13);
}
function f16ToF32(h) {
  const sign = (h & 0x8000) << 16;
  const exp = (h >> 10) & 0x1f;
  const mant = h & 0x3ff;
  let bits;
  if (exp === 0) {
    if (mant === 0) bits = sign;
    else { // subnormal
      let e = -14, m = mant;
      while ((m & 0x400) === 0) { m <<= 1; e--; }
      m &= 0x3ff;
      bits = sign | ((e + 127) << 23) | (m << 13);
    }
  } else if (exp === 31) {
    bits = sign | 0x7f800000 | (mant << 13);
  } else {
    bits = sign | ((exp - 15 + 127) << 23) | (mant << 13);
  }
  _i32[0] = bits;
  return _f32[0];
}

async function fetchWithProgress(url, key) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('fetch ' + url + ' -> HTTP ' + resp.status);
  const total = Number(resp.headers.get('content-length') || 0);
  const reader = resp.body.getReader();
  const chunks = []; let got = 0, lastPct = -1;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) {
      const pct = Math.floor((got / total) * 100);
      if (pct >= lastPct + 20) { lastPct = pct; log(key + ': model download ' + pct + '% (' + Math.round(got / 1048576) + ' MB)'); }
    }
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  return buf.buffer;
}

const MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];
function buildInput(S, asF16) {
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(photoImg, 0, 0, S, S); // squash, matching the model's preprocessor
  const px = ctx.getImageData(0, 0, S, S).data;
  const n = S * S;
  if (asF16) {
    const data = new Uint16Array(3 * n);
    for (let i = 0; i < n; i++) {
      for (let ch = 0; ch < 3; ch++) {
        data[ch * n + i] = f32ToF16((px[i * 4 + ch] / 255 - MEAN[ch]) / STD[ch]);
      }
    }
    return data;
  }
  const data = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    for (let ch = 0; ch < 3; ch++) {
      data[ch * n + i] = (px[i * 4 + ch] / 255 - MEAN[ch]) / STD[ch];
    }
  }
  return data;
}

async function runDirect(cfg, key, label) {
  setSummary(key, 'loading…');
  const t0 = performance.now();
  try {
    const ort = await import('https://esm.sh/onnxruntime-web@1.21.0');
    try { ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/'; } catch (e) {}
    const paths = [
      { url: cfg.fp16, ep: 'webgpu', f16: true },
      { url: cfg.fp32, ep: 'wasm', f16: false },
    ].filter(p => p.url);
    let lastErr = null;
    for (const p of paths) {
      try {
        log(key + ': downloading model (' + (p.f16 ? 'fp16' : 'fp32') + ') from ' + p.url.split('/').slice(-2).join('/') + ' …');
        const buf = await fetchWithProgress(p.url, key);
        log(key + ': model bytes ' + Math.round(buf.byteLength / 1048576) + ' MB; creating session on ' + p.ep + ' …');
        const session = await ort.InferenceSession.create(buf, { executionProviders: [p.ep] });
        const inName = session.inputNames[0], outName = session.outputNames[0];
        log(key + ': session OK (' + p.ep + '), input="' + inName + '", output="' + outName + '"');
        const data = buildInput(cfg.size, p.f16);
        const tensor = new ort.Tensor(p.f16 ? 'float16' : 'float32', data, [1, 3, cfg.size, cfg.size]);
        const feeds = {}; feeds[inName] = tensor;
        const t1 = performance.now();
        const out = await session.run(feeds);
        const inferSec = ((performance.now() - t1) / 1000).toFixed(1);
        const t = out[outName];
        log(key + ': inference ' + inferSec + 's; output dims ' + t.dims.join('x') + ' type ' + t.type);
        const raw = t.data;
        const n = cfg.size * cfg.size;
        const vals = new Float32Array(n);
        let mn = Infinity, mx = -Infinity;
        for (let i = 0; i < n; i++) {
          const v = t.type === 'float16' ? f16ToF32(raw[i]) : raw[i];
          vals[i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
        }
        log(key + ': mask range ' + mn.toFixed(3) + '..' + mx.toFixed(3));
        const needSigmoid = mn < -0.01 || mx > 1.01;
        const alpha = document.createElement('canvas'); alpha.width = cfg.size; alpha.height = cfg.size;
        const actx = alpha.getContext('2d');
        const imgData = actx.createImageData(cfg.size, cfg.size);
        for (let i = 0; i < n; i++) {
          let v = vals[i];
          if (needSigmoid) v = 1 / (1 + Math.exp(-v));
          const g = Math.max(0, Math.min(255, Math.round(v * 255)));
          imgData.data[i * 4] = g; imgData.data[i * 4 + 1] = g; imgData.data[i * 4 + 2] = g; imgData.data[i * 4 + 3] = 255;
        }
        actx.putImageData(imgData, 0, 0);
        const totalSec = ((performance.now() - t0) / 1000).toFixed(1);
        const usedStr = p.ep + '/' + (p.f16 ? 'fp16' : 'fp32');
        showResult(label + ' (' + usedStr + ', ' + totalSec + 's)', cutoutFromAlpha(alpha));
        setSummary(key, 'OK ' + usedStr + ', total ' + totalSec + 's, inference ' + inferSec + 's');
        log(key + ': DONE total ' + totalSec + 's');
        return;
      } catch (e) {
        lastErr = e;
        log(key + ': path ' + p.ep + '/' + (p.f16 ? 'fp16' : 'fp32') + ' FAILED: ' + (e && e.message ? e.message.slice(0, 300) : e));
      }
    }
    setSummary(key, 'FAILED both paths: ' + (lastErr && lastErr.message ? lastErr.message.slice(0, 120) : lastErr));
  } catch (e) {
    setSummary(key, 'ERROR: ' + (e && e.message ? e.message.slice(0, 160) : e));
    log(key + ': ERROR ' + (e && e.stack ? e.stack.slice(0, 400) : e));
  }
}

document.getElementById('btnA').addEventListener('click', () => {
  if (!photoFile) { log('Pick a photo first.'); return; }
  runDirect({
    fp16: 'https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model_fp16.onnx',
    fp32: 'https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx',
    size: 1024,
  }, 'A2', 'A2 BiRefNet-lite 1024 direct');
});
document.getElementById('btnD').addEventListener('click', () => {
  if (!photoFile) { log('Pick a photo first.'); return; }
  runDirect({
    fp16: 'https://huggingface.co/jiabins0303/birefnet-lite-1024-webgpu/resolve/main/onnx/model_fp16.onnx',
    fp32: null,
    size: 1024,
  }, 'A3', 'A3 BiRefNet-lite 1024 webgpu-patched');
});
document.getElementById('btnB').addEventListener('click', () => {
  if (!photoFile) { log('Pick a photo first.'); return; }
  runDirect({
    fp16: 'https://huggingface.co/studioludens/birefnet-lite-512/resolve/main/onnx/model_fp16.onnx',
    fp32: 'https://huggingface.co/studioludens/birefnet-lite-512/resolve/main/onnx/model.onnx',
    size: 512,
  }, 'B2', 'B2 BiRefNet-lite 512 direct');
});
log('Page v2 ready. WebGPU available: ' + (!!navigator.gpu));
</script>
</body>
</html>
